{% set name = "zipfile-deflate64" %}
{% set version = "0.2.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 875a3299de102edf1c17f8cafcc528b1ca80b62dc4814b9cb56867ec59fbfd18

build:
  number: 3
  script:
    # zlib 1.2.11 (zlib/zutil.h:133) takes its classic-MacOS branch when TARGET_OS_MAC is
    # defined, then does `#define fdopen(fd,mode) NULL`, which mangles the SDK prototype:
    # "stdio.h:210:7: error: expected identifier or '('". TARGET_OS_MAC is a compiler
    # predefine of our Apple clang (cctools 1030.6.3, Xcode 16.3-era) - not set by this
    # recipe - and it breaks every py version on osx, not just 3.15. conda-forge does not
    # need this because their llvm clang does not define it.
    - export CPPFLAGS="${CPPFLAGS} -UTARGET_OS_MAC"  # [osx]
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - pip
    - python
    - setuptools
    - setuptools-scm
    - toml
    - wheel
  run:
    - python

test:
  imports:
    - zipfile_deflate64
  commands:
    - pip check
  requires:
    - pip

about:
  description: Extract Deflate64 ZIP archives with Python's 'zipfile' API
  home: https://github.com/brianhelba/zipfile-deflate64
  summary: Extract Deflate64 ZIP archives with Python's zipfile API.
  dev_url: https://github.com/brianhelba/zipfile-deflate64
  doc_url: https://github.com/brianhelba/zipfile-deflate64#readme
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE

extra:
  recipe-maintainers:
    - sarthakpati
